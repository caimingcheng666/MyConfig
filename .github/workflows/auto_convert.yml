name: Update Clash Config

on:
  schedule:
    # 每天北京时间 0点 和 12点 自动更新（UTC 时间 16点 和 4点）
    - cron: '0 4,16 * * *'
  workflow_dispatch: # 允许手动点击按钮触发更新

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download and Convert Subscription
      run: |
        # 使用公共订阅转换 API，你也可以换成自己信任的后端 API
        # 这里默认加入了远程配置规则（ACL4SSR_Online），可根据需求修改 config 参数
        API_URL="https://api.w03.cc/sub?target=clash&config=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online.ini&url=${{ secrets.SUB_URL }}"
        
        # 下载并保存为 clash.yaml
        curl -L "$API_URL" -o clash.yaml

    - name: Commit and Push
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add clash.yaml
        # 只有在文件有变动时才提交，防止报错
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update clash.yaml $(date)" && git push)
