name: Auto Convert Clash Config

on:
  schedule:
    - cron: '0 */12 * * *' # 每 12 小时自动在后台更新一次节点
  workflow_dispatch: # 允许你随时在网页上点击按钮手动触发更新

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载并解压本地转换工具
        run: |
          wget https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xvf subconverter_linux64.tar.gz

      - name: 启动本地转换服务并生成配置
        env:
          AIRPORT_URL: ${{ secrets.AIRPORT_URL }}
        run: |
          # 1. 必须先进入子目录，确保 subconverter 能够正确读取当前目录下的 pref.ini 配置文件，防止闪退
          cd subconverter
          chmod +x subconverter
          ./subconverter -g &
          
          # 2. 给它 5 秒钟的充足启动时间
          sleep 5
          
          # 3. 启动成功后，切回仓库根目录，准备接收生成的配置文件
          cd ..
          
          # 4. 使用 Python 安全读取环境变量并进行 URL 编码
          ENCODED_URL=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['AIRPORT_URL']))")
          
          # 5. 请求本地已成功驻留后台的 25500 服务
          curl -L "http://127.0.0.1:25500/sub?target=clash&url=${ENCODED_URL}&config=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online_Full.ini" -o config.yaml

          # 6. 严格验证生成的文件
          if [ ! -s config.yaml ] || grep -q "Invalid" config.yaml; then
            echo "❌ 错误：转换失败！请检查你的 GitHub Secrets 里的 AIRPORT_URL 是否填写正确。"
            exit 1
          fi

      - name: 将生成的固定的配置文件推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          
          # 只有在文件内容有真正变动时才提交，防止空提交报错
          if git diff --staged --quiet; then
            echo "✅ 配置未发生变化，无需重复提交。"
          else
            git commit -m "自动同步最新机场节点"
            git push
          fi
